<!doctype html><html lang="en"><meta charset="utf-8"><title>Cross the road</title>
<style>body{font:17px system-ui;margin:20px;background:#faf8f3;color:#202830}p{max-width:860px;margin:8px 0}canvas{display:block;border:2px solid #202830}button{padding:8px;font:inherit}</style>
<h1>Cross the road</h1><p>Move the blue player to the green GOAL at the top. Arrow keys move one square; Space waits. After EVERY input, red cars advance one square RIGHT and wrap around. Avoid their new positions. Traffic advances only on input.</p>
<canvas aria-label="Road crossing game board" width="560" height="400" tabindex="0"></canvas><p id="status" role="status">Reach the goal. Moves: 0</p><button id="restart">New Game</button>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let player={x:3,y:4},cars=[{x:4,y:1},{x:1,y:2},{x:3,y:3}],moves=0,finished=false;
function draw(){ctx.fillStyle='#e9eef0';ctx.fillRect(0,0,560,400);ctx.fillStyle='#c5ecd1';ctx.fillRect(0,0,560,80);ctx.fillStyle='#133f27';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('GOAL',280,46);ctx.strokeStyle='#a8b3b8';ctx.lineWidth=1;for(let i=0;i<=7;i++){ctx.beginPath();ctx.moveTo(i*80,0);ctx.lineTo(i*80,400);ctx.stroke();}for(let i=0;i<=5;i++){ctx.beginPath();ctx.moveTo(0,i*80);ctx.lineTo(560,i*80);ctx.stroke();}cars.forEach(c=>{ctx.fillStyle='#c42d35';ctx.fillRect(c.x*80+10,c.y*80+22,60,36);ctx.fillStyle='#fff';ctx.font='bold 24px system-ui';ctx.fillText('→',c.x*80+40,c.y*80+49);});ctx.fillStyle='#135acc';ctx.beginPath();ctx.arc(player.x*80+40,player.y*80+40,24,0,Math.PI*2);ctx.fill();}
canvas.addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],' ':[0,0]}[e.key];if(!d||finished)return;e.preventDefault();player.x=Math.max(0,Math.min(6,player.x+d[0]));player.y=Math.max(0,Math.min(4,player.y+d[1]));moves++;cars.forEach(c=>c.x=(c.x+1)%7);if(cars.some(c=>c.x===player.x&&c.y===player.y)){finished=true;status.textContent='Game over. A car hit you. Moves: '+moves;}else if(player.y===0){finished=true;status.textContent='You win! Reached the goal. Moves: '+moves;}else status.textContent='Reach the goal. Moves: '+moves;draw();});
document.querySelector('#restart').onclick=()=>{player={x:3,y:4};cars=[{x:4,y:1},{x:1,y:2},{x:3,y:3}];moves=0;finished=false;status.textContent='Reach the goal. Moves: 0';draw();};draw();
</script></html>
